<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <title>Cor Sawai</title>
        <script>
            (function () {
                var pathname = window.location.pathname;
                var repoName = '/my-portfolio';

                if (pathname !== '/' && !pathname.startsWith(repoName)) {
                    window.location.replace(repoName + pathname);
                }
            })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
